name: PillPile
options:
  bundleIdPrefix: dev.pillpile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PillPile:
    type: application
    platform: iOS
    sources:
      - path: PillPile/Sources
    info:
      path: PillPile/Info.plist
      properties:
        CFBundleDisplayName: PillPile
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          PillPile uses the camera to read the printed labels on your medicine
          bottles. Photos are sent for reading and are never stored.
        NSPhotoLibraryUsageDescription: >-
          PillPile reads the printed labels in photos you choose. Photos are
          never stored.
        # Allows talking to a dev server over plain HTTP on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pillpile.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  PillPileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PillPileUITests
    dependencies:
      - target: PillPile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pillpile.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
